name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Storefront pages use `export const revalidate = 300` (ISR), so the
    # Next.js build tries to prerender them. Prerender queries the DB.
    # Spin up postgres inside the runner, apply migration + seeds, then
    # the build gets a real DB to render against. Fast (a few seconds)
    # and prevents the "force-dynamic everywhere" workaround.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: magenta
          POSTGRES_PASSWORD: magenta_dev
          POSTGRES_DB: magenta_blumen
        ports:
          - 5432:5432
        # Wait until postgres is ready before the steps run.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply schema + seeds
        # These are the same files used in local dev + prod - a single
        # source of truth. Order matters: migration first, then base
        # seed (settings, categories, colours, tax rates), then zones.
        env:
          PGPASSWORD: magenta_dev
        run: |
          psql -h localhost -U magenta -d magenta_blumen -v ON_ERROR_STOP=1 -f drizzle/0000_init.sql
          psql -h localhost -U magenta -d magenta_blumen -v ON_ERROR_STOP=1 -f drizzle/seed/01-base.sql
          psql -h localhost -U magenta -d magenta_blumen -v ON_ERROR_STOP=1 -f drizzle/seed/02-delivery-zones.sql

      - name: Build
        # DATABASE_URL now points at the live postgres service so ISR
        # pages can prerender. AUTH_SECRET is a build-time-only dummy.
        env:
          DATABASE_URL: postgres://magenta:magenta_dev@localhost:5432/magenta_blumen
          AUTH_SECRET: ci-build-only-not-a-real-secret
          AUTH_URL: http://localhost:3000
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build
