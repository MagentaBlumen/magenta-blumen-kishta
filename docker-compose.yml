services:
  postgres:
    image: postgres:17-alpine
    container_name: magenta-blumen-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: magenta
      POSTGRES_PASSWORD: magenta_dev
      POSTGRES_DB: magenta_blumen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
